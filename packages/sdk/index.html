<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DOEM SDK Test</title>

    <script
      src="./dist/tracker.js"
      data-website-id="01a1e712-f1f0-7116-979e-177e41364d41"
      defer
    ></script>
  </head>
  <body>
    <h1>DOEM SDK Test</h1>
  </body>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      if (!window.doem) {
        console.error("[DOEM TEST] SDK did not initialize window.doem");
        return;
      }
      window.doem.trackPageView({
        page: window.location.pathname
      });
      window.doem.track("signup_clicked", {
        button: "signup"
      });
      window.doem.track("login_clicked", {
        button: "login"
      });
    });
  </script>
</html>
